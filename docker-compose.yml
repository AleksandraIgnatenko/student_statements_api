
version: '3.8'

services:
  student_service:
    build: ./student_service
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql://postgres:12qwaszx@host.docker.internal:5432/postgres

  grade_service:
    build: ./grade_service
    ports:
      - "8002:8002"
    environment:
      - DATABASE_URL=postgresql://postgres:12qwaszx@host.docker.internal:5432/postgres
    depends_on:
      - student_service

  report_service:
    build: ./report_service
    ports:
      - "8003:8003"
    depends_on:
      - student_service
      - grade_service

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "8004:8004"
    depends_on:
      - student_service
      - grade_service
      - report_service