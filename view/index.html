<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Система ведомостей</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Управление студентами и оценками</h1>

        <section>
            <h2>Добавить студента</h2>
            <form id="student-form">
                <input type="text" id="surname" placeholder="Фамилия" required>
                <input type="text" id="first_name" placeholder="Имя" required>
                <input type="text" id="second_name" placeholder="Отчество" required>
                <select id="group_name" required>
                    <option value="">Выберите группу</option>
                </select>
                <button type="submit">Добавить</button>
            </form>
        </section>

        <section>
            <h2>Студенты</h2>
            <button id="load-students">Загрузить студентов</button>
            <ul id="students-list"></ul>
        </section>

        <section>
            <h2>Отчёт по студенту</h2>
            <input type="number" id="report-student-id" placeholder="ID студента" min="1">
            <button id="load-report">Показать отчёт</button>
            <div id="report-output"></div>
        </section>

        <section>
            <h2>Добавить/обновить оценку</h2>
            <form id="grade-form">
                <input type="number" id="grade-student-id" placeholder="ID студента" min="1" required>
                <select id="grade-subject" required>
                    <option value="">Выберите предмет</option>
                </select>
                <input type="number" id="grade-numeric" placeholder="Оценка (60-100)" min="60" max="100" required>
                <input type="text" id="grade-ects" placeholder="ECTS (A, B, C, D, E)" maxlength="1" required>
                <button type="submit">Сохранить оценку</button>
            </form>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
